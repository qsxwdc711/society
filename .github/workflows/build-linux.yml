name: build-linux

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.10"

      - name: Build linux amd64
        env:
          CGO_ENABLED: "0"
          GOOS: "linux"
          GOARCH: "amd64"
        run: |
          go mod tidy
          go build -trimpath -ldflags "-s -w" -o society .

      - name: Package
        run: |
          tar -czf society_linux_amd64.tar.gz society

      - name: Release (tag only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: society_linux_amd64.tar.gz
